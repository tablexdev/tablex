# staticcheck configuration.
#
# Everything is on except ST1005 ("error strings should not be capitalized / end
# with punctuation"). That convention exists because Go errors are usually
# wrapped into a longer sentence, where a capital in the middle reads wrong.
# TableX's form-validation errors are the opposite case: they are terminal, and
# they are rendered verbatim to a person as flash text — "Invalid column name."
# is the message the user sees, not a clause inside someone else's error. Making
# them lowercase and unpunctuated would degrade the UI to satisfy a rule about a
# situation that does not apply.
#
# Every other check, including all SA* correctness checks, is enforced in CI.
checks = ["all", "-ST1005"]
