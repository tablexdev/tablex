name: Bug report
description: Something behaves wrongly or breaks
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. **Security issues do not belong here** — see the
        [security policy](https://github.com/tablexdev/tablex/blob/master/SECURITY.md)
        for private reporting.
  - type: input
    id: version
    attributes:
      label: TableX version
      description: Output of `tablex -version`
      placeholder: tablex v1.0.1
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: OS / platform
      placeholder: Ubuntu 24.04 amd64, macOS 15 arm64, Windows 11, Docker...
    validations:
      required: true
  - type: dropdown
    id: engine
    attributes:
      label: Database engine
      multiple: true
      options:
        - MySQL
        - MariaDB
        - PostgreSQL
        - SQLite
        - not engine-specific
    validations:
      required: true
  - type: input
    id: engine-version
    attributes:
      label: Engine version
      placeholder: MySQL 8.4, PostgreSQL 16.3, ...
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What did you do, what did you see, and what did you expect?
      placeholder: |
        1. Open table X, click ...
        2. Observe ...
        Expected: ...
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs / output
      description: Relevant stderr output. **Never include passwords or session cookies.**
      render: text
